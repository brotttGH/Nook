<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f8;--card:#fff;--ink:#1b1d3a;--mute:#6a6e90;--line:#dcdff0;--acc:#4f46e5;--accsoft:#e6e4fd;--heart:#e11d68;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152a;--card:#1d1f3b;--ink:#eceefc;--mute:#9a9ec6;--line:#2d3058;--acc:#8b85ff;--accsoft:#2a2a5a;--heart:#ff5c93;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14152a;--card:#1d1f3b;--ink:#eceefc;--mute:#9a9ec6;--line:#2d3058;--acc:#8b85ff;--accsoft:#2a2a5a;--heart:#ff5c93;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/var(--lh,1.5) var(--body,Figtree,system-ui,sans-serif)}
.wrap{max-width:var(--mw,560px);margin:0 auto;padding:0 14px 40px;zoom:var(--fs,1)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
h1{margin:0;font:800 30px/1 var(--head,'Bricolage Grotesque',Figtree,sans-serif);letter-spacing:-.03em}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.card{background:var(--card);border:var(--bw,1px) solid var(--line);border-radius:var(--r,18px);padding:var(--pad,14px);margin-bottom:var(--gap,12px)}
.av{width:40px;height:40px;border-radius:var(--avr,50%);display:grid;place-items:center;color:#fff;font:800 16px var(--head,'Bricolage Grotesque',Figtree,sans-serif);flex:none}
.row{display:flex;gap:12px}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;min-height:64px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.count{font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:0;background:none;color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.post-btn{background:var(--acc);color:#fff;font-weight:600;padding:8px 18px;border-radius:999px}
.post-btn:disabled{opacity:.4;cursor:default}
.who{font-weight:600}.when{font-size:13px;color:var(--mute);margin-left:6px;font-weight:400}
.txt{margin:2px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:18px;font-size:14px}
.acts button{padding:4px 0;display:flex;gap:5px;align-items:center}
.acts .liked{color:var(--heart);font-weight:600}
.cm{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cm p{margin:0 0 8px;font-size:15px}.cm b{font-weight:600}
.cm form{display:flex;gap:8px}
.cm input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit}
.cm form button{color:var(--acc);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.auth h2{margin:0 0 10px;font:800 20px/1.2 var(--head,'Bricolage Grotesque',Figtree,sans-serif)}
.auth input{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.auth .er{color:var(--heart);font-size:14px;min-height:20px;margin:0 0 6px}
.auth .sw{color:var(--acc);font-weight:600;margin-left:12px}
.auth small{display:block;margin-top:10px;color:var(--mute);font-size:13px}
.me button{color:var(--acc);font-weight:600}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 2px;margin-top:2px}
.tab{flex:none;padding:8px 14px;border-radius:12px 12px 0 0;background:transparent;color:var(--mute);font-weight:600;font-size:14px;border:1px solid transparent;border-bottom:0;white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);border-color:var(--line)}
.addr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:8px 10px;margin-bottom:12px}
.path{flex:1;min-width:0;font-size:14px;color:var(--mute);background:var(--bg);border-radius:999px;padding:5px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr button{font-size:14px;padding:4px 8px;border-radius:8px}
.addr button.on{background:var(--accsoft);color:var(--acc);font-weight:600}
.chip{margin-left:8px;font-size:12px;background:var(--accsoft);color:var(--acc);border-radius:999px;padding:1px 8px;font-weight:600}
#pa{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:5px 8px;font:inherit;font-size:14px}
input.path{border:0;outline:0;font:inherit;font-size:14px;color:var(--ink)}
.h{margin:0 0 8px;font:800 18px/1.2 var(--head,'Bricolage Grotesque',Figtree,sans-serif)}
button.who{color:var(--ink);padding:0;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.item:last-child{border-bottom:0}
.thread{display:flex;flex-direction:column;margin:8px 0}
.msg{width:fit-content;max-width:80%;padding:8px 12px;border-radius:16px;margin:3px 0;background:var(--bg);overflow-wrap:anywhere}
.msg.me{background:var(--acc);color:#fff;margin-left:auto}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink)}
.pill.on{background:var(--accsoft);color:var(--acc);border-color:var(--acc);font-weight:600}
.danger{color:var(--heart);font-weight:600}
small.n{display:block;color:var(--mute);font-size:13px;margin-top:8px}
.tabw{flex:none;display:flex;align-items:center;border-radius:12px 12px 0 0;border:1px solid transparent;border-bottom:0;color:var(--mute)}
.tabw.on{background:var(--card);border-color:var(--line)}
.tabw button{padding:8px 4px 8px 12px;font-weight:600;font-size:14px;color:inherit}
.tabw.on button{color:var(--ink)}
.tabw button.x{padding:8px 10px 8px 4px;font-size:18px;line-height:1;font-weight:400}
.tabw.pin button{padding-right:12px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hubtile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;color:var(--ink);min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border-radius:var(--r,18px)}
.hubtile b{font:800 20px/1.1 var(--head,'Bricolage Grotesque',Figtree,sans-serif)}
.hubtile span{font-size:13px;color:var(--mute)}
.hubtile.on{border-color:var(--acc)}
.ph{text-align:center}
.av.bigav{width:84px;height:84px;font-size:34px;margin:0 auto 8px}
.stats{display:flex;justify-content:center;gap:12px 22px;flex-wrap:wrap;margin:12px 0}
.stats b{display:block;font:800 19px var(--head,'Bricolage Grotesque',Figtree,sans-serif);color:var(--ink)}
.stats span{font-size:13px;color:var(--mute)}
.pbtns{display:flex;justify-content:center;gap:8px}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 8px}
.ptabs button{flex:1;padding:10px;font-weight:600;border-bottom:2px solid transparent}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(var(--gc,3),1fr);gap:3px}
.tile2{aspect-ratio:3/4;border-radius:calc(var(--r,18px)/3);padding:8px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;line-height:1.3;overflow:hidden}
.tile2 .t{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes tin{from{opacity:0;transform:translateX(-12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:scale(.85)}}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#view.enter{animation:rise .3s cubic-bezier(.2,.7,.3,1)}
body,.card,.tabw,.addr{transition:background-color .3s,color .3s,border-color .3s}
button{transition:transform .12s,background-color .2s,color .2s,opacity .2s}
button:active{transform:scale(.95)}
.tabw.new{animation:tin .28s cubic-bezier(.2,.7,.3,1)}
.tabw.out{animation:tout .15s ease-in forwards}
.hubtile,.tile2{transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
@media (hover:hover){.hubtile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(40,40,90,.14)}.tile2:hover{transform:scale(1.03)}}
.hrt{display:inline-block}.hrt.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.msg.fresh{animation:msgin .25s ease-out}
.ptabs button{transition:border-color .2s,color .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
html[data-bg="tint"] body{background:color-mix(in srgb,var(--acc) 9%,var(--bg))}
html[data-bg="pure"] body{background:var(--card)}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;flex:none}
.dot.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
input[type=color]{width:36px;height:32px;border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.ef input,.ef textarea{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit}
.ef textarea{min-height:70px}
</style>
<style>
.cvs{display:block;width:100%;max-width:300px;margin:10px auto;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.cvs.chk{background:repeating-conic-gradient(#e4e4ee 0 25%,#fff 0 50%) 50%/16px 16px}
.chars{display:flex;flex-wrap:wrap;gap:4px}
.chars button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-weight:600;padding:0}
.chars button.on{background:var(--accsoft)}
.chars button.cur{outline:2px solid var(--acc)}
input[type=range]{accent-color:var(--acc)}
</style>
<style>
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
video.pic{background:#000;max-height:360px}
.hype{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.hype i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:hfall 2.4s ease-in forwards}
.hype b{position:absolute;bottom:-50px;animation:hrise 2.6s ease-out forwards}
.hype em{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px var(--acc);animation:hglow 2.4s ease-out forwards}
.hype .ht{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:htin 3s ease forwards}
@keyframes hfall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@keyframes hrise{0%{opacity:1}to{transform:translateY(-115vh) rotate(18deg);opacity:0}}
@keyframes hglow{0%{opacity:0}30%{opacity:1}to{opacity:0}}
@keyframes htin{0%{opacity:0;transform:translate(-50%,-20px)}12%,80%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
html[data-cs="shadow"] .card{box-shadow:0 6px 18px rgba(30,30,80,.14)}
html[data-cs="glass"] .card{background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html[data-ts="off"] .when{display:none}
.thumb{width:60px;border-radius:10px;flex:none;align-self:flex-start}
.h{font-size:calc(18px*var(--hs,1))!important}h1{font-size:calc(30px*var(--hs,1))!important}
html[data-bs="soft"] .post-btn{background:var(--accsoft);color:var(--acc)}
html[data-bs="outline"] .post-btn{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
html[data-tb="line"] .tabw{border-radius:0;background:none!important;border-color:transparent!important}
html[data-tb="line"] .tabw.on{border-bottom:2px solid var(--acc)!important}
html[data-tb="pill"] .tabw{border-radius:999px;margin:0 2px 6px;border:1px solid var(--line)}
html[data-tb="pill"] .tabw.on{background:var(--accsoft);border-color:var(--acc)}
.crow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.sl{display:block;margin:10px 0}.sl input{width:100%}
.nmi{display:block;width:100%;margin-bottom:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}
.bdg{width:18px;height:18px;vertical-align:-4px;margin-left:3px}
.x2{color:var(--mute);padding:0 4px;margin-left:4px}
.pic{display:block;max-width:100%;border-radius:12px;margin:4px 0 8px}
.msg .pic{max-width:240px;margin:0 0 4px}
.ef select{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit}
</style>
<style id="cust"></style>
</head>
<body>
<div class="wrap">
  <header><h1 id="appn">Nook</h1><div class="me" id="who"></div></header>
  <p class="er" id="tob" role="status" hidden style="margin:0 2px 8px"></p>
  <p class="card" id="anb" role="status" hidden style="margin-bottom:10px;font-weight:600"></p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Main"></nav>
  <div class="addr"><input class="path" id="addr" aria-label="Address bar" spellcheck="false" autocapitalize="none" autocomplete="off">
    <span id="homebar" style="display:flex;gap:4px;align-items:center"><select id="arf" aria-label="Filter by area"></select><button data-sort="new">Newest</button><button data-sort="top">Top</button></span></div>
  <section class="card auth" id="auth" hidden>
    <h2 id="at">Log in</h2>
    <form id="af">
      <input id="u" placeholder="Username" autocomplete="username" maxlength="20" autocapitalize="none" aria-label="Username" hidden>
      <input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="p" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <p class="er" id="er" role="alert"></p>
      <button class="post-btn" id="ab">Log in</button>
      <button type="button" class="sw" id="sw">New here? Sign up</button>
    </form>
    <div class="acts" id="oa" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="pill" data-oauth="google">Continue with Google</button><button class="pill" data-oauth="discord">Continue with Discord</button></div>
    <small id="rules" hidden>Use 8+ characters with a capital, a lowercase letter, a number, and a symbol.</small>
  </section>
  <section class="card" id="comp" aria-label="New post" hidden>
    <div class="row"><div class="av" id="meav"></div>
      <div style="flex:1"><textarea id="t" maxlength="280" placeholder="What’s on your mind?"></textarea></div></div>
    <div id="pimg" hidden style="margin:6px 0"><img class="pic" alt="Attached photo" style="max-height:200px"><video id="pvid" class="pic" controls playsinline hidden></video><button type="button" class="pill" data-rmimg>Remove media</button></div>
    <div class="bar"><span class="count" id="c">280</span><button type="button" class="pill" data-attach="post">Media</button><select id="pa" aria-label="Post to area"></select><button class="post-btn" id="go" disabled>Post</button></div>
  </section>
  <form class="card composer" id="ff" hidden><input id="fu" placeholder="Add a friend by username" maxlength="20" autocapitalize="none" aria-label="Friend username"><button class="post-btn">Add</button></form>
  <p class="er" id="fe" role="alert"></p>
  <section class="card" id="admp" hidden><h2 class="h">Admin tools <span class="count" id="admt"></span></h2>
    <div class="acts" style="gap:8px;flex-wrap:wrap;align-items:center"><input id="gn2" type="number" inputmode="numeric" placeholder="Coins" aria-label="Coins to give" style="width:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px;font:inherit"><button class="pill" data-adm="give">Give coins</button><button class="pill" data-adm="reset">Reset hype timer</button></div>
    <div class="acts" style="margin-top:8px;gap:8px;flex-wrap:wrap;align-items:center"><select id="tos" aria-label="Timeout length"><option value="10">10 minutes</option><option value="60">1 hour</option><option value="1440">1 day</option><option value="10080">1 week</option></select><button class="pill" data-adm="timeout">Time out</button><button class="pill" data-adm="untimeout">Lift timeout</button></div></section>
  <form class="card ef" id="shf" hidden><h2 class="h">Sell your design</h2><p class="count" style="margin-bottom:8px">Lists your current look from Customize and Settings: theme, font, background, and outline.</p><input id="sn" placeholder="Design name" maxlength="40" aria-label="Design name"><input id="sd" placeholder="Description (optional)" maxlength="160" aria-label="Description"><input id="sp" type="number" inputmode="numeric" min="0" max="999" placeholder="Price in coins (0 = free)" aria-label="Price in coins"><p class="count" id="shfee" style="margin-bottom:8px"></p><button class="post-btn">List my current look</button></form>
  <section class="card" id="bdg" hidden><h2 class="h">Draw a badge</h2>
    <canvas class="cvs chk" id="bcv" width="160" height="160" style="max-width:200px"></canvas>
    <div class="acts" style="gap:8px;flex-wrap:wrap;align-items:center"><input type="color" id="bcol" value="#e11d68" aria-label="Brush color"><input type="range" id="bsz" min="2" max="30" value="10" aria-label="Brush size"><button class="pill" id="bundo" type="button">Undo</button><button class="pill" id="bclr" type="button">Clear</button></div>
    <div class="acts" style="margin-top:10px;gap:8px"><input class="nmi" id="bnm" placeholder="Badge name" maxlength="24" aria-label="Badge name" style="margin:0;flex:1"><button class="post-btn" id="bmk" type="button">Create badge</button></div></section>
  <form class="card ef" id="evf" hidden><h2 class="h">Create an event</h2><input id="et" placeholder="Event title" maxlength="60" aria-label="Event title"><input id="ed" placeholder="Description (optional)" maxlength="300" aria-label="Description"><input id="es" type="datetime-local" aria-label="Start time"><select id="edu" aria-label="Length"><option value="60">1 hour</option><option value="180">3 hours</option><option value="1440">1 day</option><option value="10080">1 week</option></select><input id="ec" type="number" inputmode="numeric" min="0" placeholder="Coin reward for attendees (optional)" aria-label="Coin reward"><select id="eb" aria-label="Badge reward"><option value="">No badge reward</option></select><button class="post-btn">Create event</button></form>
  <form class="card composer" id="anf" hidden><input id="ant" placeholder="Announcement shown to everyone" maxlength="200" aria-label="Announcement"><button class="post-btn">Post</button><button type="button" class="pill" data-anoff>Clear</button></form>
  <form class="card ef" id="gcf" hidden><h2 class="h">Create a group</h2><input id="gn" placeholder="Group name" maxlength="40" aria-label="Group name"><input id="gd" placeholder="Description (optional)" maxlength="160" aria-label="Description"><select id="gv" aria-label="Who can see this group"><option value="public">Public: anyone can see and join</option><option value="private">Private: invite only</option></select><button class="post-btn">Create group</button></form>
  <main id="view"></main>
  <form class="card composer" id="gf" hidden><button type="button" class="pill" data-attach="grp">Media</button><input id="gt" placeholder="Message the group" maxlength="500" aria-label="Group message"><button class="post-btn">Send</button></form>
  <form class="card composer" id="gi" hidden><input id="gu" placeholder="Invite someone by username" maxlength="20" autocapitalize="none" aria-label="Invite username"><button class="pill">Invite</button></form>
  <form class="card composer" id="dmf" hidden><button type="button" class="pill" data-attach="dm">Media</button><input id="dt" placeholder="Write a message" maxlength="500" aria-label="Message"><button class="post-btn">Send</button></form>
</div>
